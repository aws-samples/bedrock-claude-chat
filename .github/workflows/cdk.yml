name: CDK tests

on:
  pull_request:
    branches:
      - main
      - v1
      - v3
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - run: |
          cd cdk
          npm ci
          npx cdk synth
  cdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - run: |
          cd cdk
          npm ci
          npm run test
