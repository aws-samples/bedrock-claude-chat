[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13.0"
fastapi = ">=0.109.1,<1"
requests = "^2.33.0"
types-requests = "^2.31.0"
pydantic = "^2.10.2"
pyhumps = "^3.8.0"
uvicorn = ">=0.23.1,<1"
python-ulid = "^1.1.0"
boto3 = "^1.37.0"
pg8000 = "^1.31.5"
argparse = "^1.4.0"
tenacity = "<=8.3.0"
langdetect = "^1.0.9"
types-retry = ">=0.9.9.4,<1"
opensearch-py = ">=2.0.0"
requests-aws4auth = ">=1.0.0"
duckduckgo-search = "^7.3.0"
boto3-stubs = {extras = ["bedrock", "bedrock-agent", "bedrock-agent-runtime", "bedrock-runtime", "boto3", "cloudformation"], version = "^1.40.56"}
firecrawl-py = "^2.16.3"
reretry = "^0.11.8"
strands-agents = "^1.61.0"
pyjwt = {version = "^2.10.1", extras = ["crypto"]}

[tool.poetry.group.dev.dependencies]
